<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{APP_NAME}} &mdash; {{APP_TAGLINE}}</title>
  <meta name="description" content="{{APP_DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a11;
      --bg-surface: #0e1422;
      --bg-glass: rgba(14, 20, 34, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --text-heading: #f8fafc;
      --text-body: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      line-height: 1.7;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    header { padding: 24px 0; border-bottom: 1px solid var(--border); }
    .hero { padding: 90px 0 60px; text-align: center; }
    h1 { font-size: 48px; color: var(--text-heading); font-weight: 800; margin-bottom: 18px; }
    p.sub { font-size: 18px; max-width: 600px; margin: 0 auto 36px; }
    .btn-main { background: #fff; color: #000; padding: 14px 28px; border-radius: 12px; font-weight: 700; text-decoration: none; display: inline-block; }
    footer { border-top: 1px solid var(--border); padding: 40px 0; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:800; font-size:20px; color:#fff;">{{APP_NAME}}</span>
      <a href="https://quangvietnguyen.github.io/support/{{APP_SLUG}}/" style="color:var(--text-body); text-decoration:none;">Support</a>
    </div>
  </header>
  <main class="container hero">
    <h1>{{HERO_HEADLINE}}</h1>
    <p class="sub">{{APP_DESCRIPTION}}</p>
    <a href="#download" class="btn-main"> Download on App Store</a>
  </main>
  <footer>
    <div class="container">
      &copy; 2026 {{APP_NAME}}. All rights reserved. &bull; <a href="https://quangvietnguyen.github.io/privacy/{{APP_SLUG}}/" style="color:var(--text-muted);">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
