<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{APP_NAME}} &mdash; {{APP_TAGLINE}}</title>
  <meta name="description" content="{{APP_DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-surface: #f8fafc;
      --border: #e2e8f0;
      --text-heading: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --accent: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      line-height: 1.7;
      font-size: 15.5px;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    header { padding: 20px 0; border-bottom: 1px solid var(--border); }
    .hero { padding: 90px 0 70px; text-align: center; }
    h1 { font-size: 48px; color: var(--text-heading); font-weight: 800; letter-spacing: -1.5px; margin-bottom: 18px; }
    p.sub { font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto 36px; line-height: 1.6; }
    .btn-main { background: var(--text-heading); color: #fff; padding: 14px 28px; border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    footer { border-top: 1px solid var(--border); padding: 40px 0; font-size: 13px; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:800; font-size:18px; color:var(--text-heading);">{{APP_NAME}}</span>
      <a href="https://quangvietnguyen.github.io/support/{{APP_SLUG}}/" style="color:var(--text-muted); text-decoration:none; font-size:14px; font-weight:500;">Support</a>
    </div>
  </header>
  <main class="container hero">
    <h1>{{HERO_HEADLINE}}</h1>
    <p class="sub">{{APP_DESCRIPTION}}</p>
    <a href="#download" class="btn-main"> Download on App Store</a>
  </main>
  <footer>
    <div class="container">
      &copy; 2026 {{APP_NAME}}. All rights reserved. &bull; <a href="https://quangvietnguyen.github.io/privacy/{{APP_SLUG}}/" style="color:var(--text-muted);">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
